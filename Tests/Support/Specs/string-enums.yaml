openapi: 3.0.0
info:
  title: String Enums
  version: 1.0.0
paths:
  /fees:
    get:
      operationId: getFees
      parameters:
        - name: type
          in: query
          schema:
            type: string
            enum:
              - Interest
              - CustodyFee
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Fee"
    post:
      operationId: createFee
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFeeRequest"
      responses:
        "204":
          description: Successful operation
components:
  schemas:
    CreateFeeRequest:
      type: object
      properties:
        frequency:
          type: string
          enum:
            - Daily
            - Monthly
    DailyFeeType:
      type: string
      enum:
        - Interest
        - CustodyFee
    Fee:
      type: object
      properties:
        type:
          $ref: "#/components/schemas/DailyFeeType"
